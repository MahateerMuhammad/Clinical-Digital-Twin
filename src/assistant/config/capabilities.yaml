# src/assistant/config/capabilities.yaml
# ──────────────────────────────────────
# What the assistant tells a new user it can help with.  Spec section 2.
#
# Configuration, not prompt text. Spec 2 requires the capability list to be set
# by the application rather than hardcoded into the model, so that narrowing the
# assistant's remit is an edit to this file — and cannot be talked out of by a
# user, because the model is never asked what it can do.
#
# Every entry maps to an intent that has a requirement policy. A capability with
# no policy would be advertised and then refuse on arrival.

version: "2026.08.1"

greeting: >-
  I can help you understand health information, but I am not a doctor and I
  cannot diagnose you. I will ask questions before answering, and I will tell
  you when something needs a real clinician.

capabilities:
  - intent: symptom_assessment
    label: Understanding symptoms
    detail: What a symptom might mean, and whether it needs medical attention.

  - intent: condition_information
    label: General health information
    detail: What a condition is, what causes it, and how it is usually managed.

  - intent: medication_question
    label: Medication information
    detail: What a medicine is for, and what to be aware of while taking it.

  - intent: lab_result_interpretation
    label: Understanding test results
    detail: What a laboratory value means, using the reference range on your report.

  - intent: medical_report_explanation
    label: Understanding medical reports
    detail: Plain-language explanation of a report you have received.

  - intent: doctor_question_prep
    label: Preparing questions for your doctor
    detail: Helping you get the most out of a short appointment.

  - intent: terminology
    label: Explaining medical terms
    detail: What a word on your report or prescription means.

  - intent: preventive_health
    label: Preventive health
    detail: Screening, vaccination and lifestyle information.

  - intent: treatment_question
    label: Understanding treatments
    detail: How a condition is usually treated, and what the options involve.

closing_question: What would you like help with today?

# Shown whenever the assistant gives a substantive medical answer.
disclaimer: >-
  This is general health information, not a diagnosis or medical advice. It is
  based only on what you have told me and on the sources I cite. Please speak to
  a doctor or pharmacist about your own care.

# Shown whenever triage detects a possible emergency.
emergency_disclaimer: >-
  I cannot assess how serious this is from a conversation. If you think this may
  be an emergency, contact your local emergency number or go to an emergency
  department now.
